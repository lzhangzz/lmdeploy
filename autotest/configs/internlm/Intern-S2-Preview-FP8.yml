# HF model id: internlm/Intern-S2-Preview-FP8
h:
- model_type:
  - chat
  - vl
  engine_config:
    tp: 1
  backends:
  - name: turbomind
    communicators:
    - nccl
  test_coverage:
  - benchmark
  - evaluate
  - func
  - longtext_benchmark
  - mllm_evaluate
  interface:
    turbomind:
    - suites:
      - base
      - logprob
      - toolcall
      - reasoning
      extra:
        tool-call-parser: interns2-preview
        reasoning-parser: default
    - suites:
      - anthropic
  gen_config:
    chat-template-kwargs:
      enable_thinking: true
