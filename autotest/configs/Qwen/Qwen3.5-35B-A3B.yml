# HF model id: Qwen/Qwen3.5-35B-A3B
a100:
- model_type:
  - chat
  - vl
  engine_config:
    tp: 2
  backends:
  - name: turbomind
    communicators:
    - nccl
    - cuda-ipc
  test_coverage:
  - func
  interface:
    turbomind:
    - suites:
      - base
      - logprob
      - toolcall
      - reasoning
      extra:
        tool-call-parser: qwen3coder
        reasoning-parser: default
    - suites:
      - anthropic
    - suites:
      - abort
      extra:
        enable-abort-handling: true
  quantization:
    turbomind:
    - kvint8
h:
- model_type:
  - chat
  - vl
  engine_config:
    tp: 2
  backends:
  - name: turbomind
    communicators:
    - nccl
    - cuda-ipc
  test_coverage:
  - benchmark
  - evaluate
  - func
  - longtext_benchmark
  - longtext_evaluate
  - mllm_evaluate
  interface:
    turbomind:
    - suites:
      - base
      - logprob
      - toolcall
      - reasoning
      extra:
        tool-call-parser: qwen3coder
        reasoning-parser: default
    - suites:
      - anthropic
    - suites:
      - abort
      extra:
        enable-abort-handling: true
